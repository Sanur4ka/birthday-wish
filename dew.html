<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Birthday</title>

<style>
body{
    font-family: Arial;
    text-align:center;
    background: linear-gradient(135deg,#ff9a9e,#fad0c4);
    height:100vh;
    margin:0;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

/* Initial Overlay to "Enable" Sound */
#overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: white;
    z-index: 3000;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

.container{
    background:white;
    padding:60px;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
    width:550px;
    position:relative;
    z-index:10;
}

h1{ font-size:3em; }
p{ font-size:1.3em; }

button{
    padding:14px 24px;
    margin:10px;
    border:none;
    border-radius:10px;
    background:#ff4b5c;
    color:white;
    font-size:18px;
    cursor:pointer;
    transition: transform 0.1s;
}

button:active{ transform: scale(0.95); }

#surpriseBtn{
    position:fixed;
    top:38px;
    right:38px;
    font-size:38px;
    opacity:0;
    transition: opacity 0.3s;
    z-index:1000;
}

#surpriseBtn.show{ opacity:1; }

.emoji{
    position:fixed;
    top:-50px;
    font-size:24px;
    animation-name:fall;
    animation-timing-function:linear;
    transition: opacity 0.1s;
    z-index:5;
}

@keyframes fall {
    0% {transform: translateY(0) rotate(0deg); opacity:1;}
    100% {transform: translateY(100vh) rotate(360deg); opacity:0;}
}

#popup{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    background:#fff;
    padding:40px;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,0.3);
    z-index:2000;
    display:none;
    font-size:1.5em;
}

.side-photo{
    position:fixed;
    top:50%;
    transform:translateY(-50%);
    width:350px;             
    border-radius:15px;
    border:5px solid white;  
    opacity:0;
    transition: opacity 1.5s ease;
    z-index:5;
}

#photoLeft{ left:100px; }
#photoRight{ right:100px; }
.side-photo.show{ opacity:1; }
</style>
</head>
<body>

<div id="overlay">
    <h1>🎁 You have a surprise!</h1>
    <button onclick="startEverything()">Click to Open 🎈</button>
</div>

<img id="photoLeft" src="photo1.jpg" alt="Photo Left" class="side-photo">
<img id="photoRight" src="photo2.jpg" alt="Photo Right" class="side-photo">

<button id="surpriseBtn" onclick="showSurprise()">🎁</button>

<div class="container">
    <div id="mainPage">
        <h1>🎂 Happy Birthday</h1>
        <p>I made something special for you.</p>
        <button onclick="openNote()">Open Special Note 💌</button>
    </div>

    <div id="notePage" style="display:none;">
        <h1>💌 Special Note</h1>
        <p>
            You are one of the best friends I could ever ask for.<br>
            Thank you for all the memories and laughs.<br>
            I hope this year brings you happiness and success.
        </p>
        <button onclick="goBack()">⬅ Back</button>
    </div>
</div>

<div id="popup">
    🎉 Surprise! Have an amazing birthday! 🎉
    <br>
    <button onclick="closePopup()">Close</button>
</div>

<audio id="birthdaySong" loop>
    <source src="song.mp3" type="audio/mpeg">
</audio>

<script>
// This function handles the "beginning" play
function startEverything() {
    // Hide overlay
    document.getElementById("overlay").style.display = "none";
    
    // Play song immediately
    const song = document.getElementById("birthdaySong");
    song.play().catch(e => console.log("Playback error:", e));
}

function openNote(){
    document.getElementById("mainPage").style.display = "none";
    document.getElementById("notePage").style.display = "block";
    document.getElementById("surpriseBtn").classList.add("show");
    document.getElementById("photoLeft").classList.add("show");
    document.getElementById("photoRight").classList.add("show");
}

function goBack(){
    document.getElementById("notePage").style.display = "none";
    document.getElementById("mainPage").style.display = "block";
    document.getElementById("surpriseBtn").classList.remove("show");
    document.getElementById("photoLeft").classList.remove("show");
    document.getElementById("photoRight").classList.remove("show");
}

function showSurprise(){
    document.getElementById("popup").style.display = "block";
}

function closePopup(){
    document.getElementById("popup").style.display = "none";
}

function createEmoji(){
    const emoji = document.createElement("div");
    emoji.classList.add("emoji");
    const emojis = ["🎂","🎉","🎈","🎁"];
    emoji.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    emoji.style.left = Math.random()*window.innerWidth + "px";
    emoji.style.fontSize = (20 + Math.random()*30) + "px";
    emoji.style.animationDuration = (3 + Math.random()*3) + "s";
    document.body.appendChild(emoji);

    const container = document.querySelector('.container');
    const checkInterval = setInterval(()=> {
        const emojiRect = emoji.getBoundingClientRect();
        const containerRect = container.getBoundingClientRect();
        if(emojiRect.top + emojiRect.height/2 >= containerRect.top &&
           emojiRect.top + emojiRect.height/2 <= containerRect.bottom &&
           emojiRect.left + emojiRect.width/2 >= containerRect.left &&
           emojiRect.left + emojiRect.width/2 <= containerRect.right){
            emoji.style.opacity = 0.4;
        } else {
            emoji.style.opacity = 1;
        }
    }, 50);

    setTimeout(()=> {
        clearInterval(checkInterval);
        document.body.removeChild(emoji);
    }, 6000);
}

setInterval(createEmoji, 400);
</script>
</body>
</html>
