<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday!</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column; /* Changed for better mobile scrolling */
            align-items: center;
            overflow-x: hidden;
        }

        /* 1. Start Overlay */
        #overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: white;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* 2. Main Card */
        .container {
            background: white;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            width: 90%;
            max-width: 450px;
            margin: 100px 20px 20px 20px;
            z-index: 10;
        }

        h1 { color: #ff4b5c; font-size: 1.8em; }
        p { font-size: 1.1em; color: #444; }

        button {
            padding: 12px 24px;
            margin: 10px;
            border: none;
            border-radius: 50px;
            background: #ff4b5c;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        /* 3. THE STICKY SURPRISE BUTTON */
        /* This will stay at the top of the screen ONLY when scrolling through the gallery */
        #surpriseBtn {
            position: -webkit-sticky; /* Support for Safari */
            position: sticky;
            top: 20px; 
            margin-left: auto;
            margin-right: 20px;
            font-size: 35px;
            background: white;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: none; /* Hidden until openNote() is clicked */
            justify-content: center;
            align-items: center;
            z-index: 9999;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            border: 4px solid #ff4b5c;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        /* 4. Photo Gallery */
        .photo-gallery {
            display: none;
            width: 90%;
            max-width: 450px;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 50px;
        }

        .side-photo {
            width: 100%;
            border-radius: 15px;
            border: 6px solid white;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        /* 5. Animations & Popup */
        .emoji {
            position: fixed;
            top: -50px;
            pointer-events: none;
            animation: fall linear forwards;
            z-index: 1;
        }

        @keyframes fall {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(110vh); opacity: 0; }
        }

        #popup {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 30px;
            border-radius: 20px;
            width: 80%;
            max-width: 300px;
            z-index: 10001;
            display: none;
            box-shadow: 0 10px 50px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <div id="overlay">
        <h1>🎁 Tap to see the surprise!</h1>
        <button onclick="startEverything()">Open 🎈</button>
    </div>

    <div class="container">
        <div id="mainPage">
            <h1>🎂 Happy Birthday!</h1>
            <p>I have something to tell you...</p>
            <button onclick="openNote()">Read Note 💌</button>
        </div>

        <div id="notePage" style="display:none;">
            <h1>💌 For You</h1>
            <p>
                You are a truly amazing friend.<br>
                Thank you for everything!<br>
                Scroll down to see our memories.
            </p>
            <button onclick="goBack()">⬅ Back</button>
        </div>
    </div>

    <button id="surpriseBtn" onclick="showSurprise()">🎁</button>

    <div id="gallery" class="photo-gallery">
        <img src="photo1.jpg" alt="Photo 1" class="side-photo">
        <img src="photo2.jpg" alt="Photo 2" class="side-photo">
    </div>

    <div id="popup">
        <h2>🎉 Surprise!</h2>
        <p>You found it! Have the best birthday ever!</p>
        <button onclick="closePopup()">Close</button>
    </div>

    <audio id="birthdaySong" loop>
        <source src="song.mp3" type="audio/mpeg">
    </audio>

    <script>
        const song = document.getElementById("birthdaySong");
        const surpriseBtn = document.getElementById("surpriseBtn");

        function startEverything() {
            document.getElementById("overlay").style.display = "none";
            song.play();
        }

        function openNote() {
            document.getElementById("mainPage").style.display = "none";
            document.getElementById("notePage").style.display = "block";
            document.getElementById("gallery").style.display = "flex";
            surpriseBtn.style.display = "flex";
        }

        function goBack() {
            document.getElementById("notePage").style.display = "none";
            document.getElementById("mainPage").style.display = "block";
            document.getElementById("gallery").style.display = "none";
            surpriseBtn.style.display = "none";
        }

        function showSurprise() { document.getElementById("popup").style.display = "block"; }
        function closePopup() { document.getElementById("popup").style.display = "none"; }

        function createEmoji() {
            const emoji = document.createElement("div");
            emoji.classList.add("emoji");
            const emojis = ["🎂", "🎉", "🎈", "🎁"];
            emoji.textContent = emojis[Math.floor(Math.random() * emojis.length)];
            emoji.style.left = Math.random() * 100 + "vw";
            emoji.style.fontSize = (Math.random() * 20 + 20) + "px";
            emoji.style.animationDuration = (Math.random() * 2 + 3) + "s";
            document.body.appendChild(emoji);
            setTimeout(() => emoji.remove(), 5000);
        }
        setInterval(createEmoji, 500);
    </script>
</body>
</html>
