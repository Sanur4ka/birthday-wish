<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday!</title>
    <style>
        /* Base Reset */
        * { box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        /* 1. Start Overlay */
        #overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: white;
            z-index: 5000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* 2. Content Layout */
        .wrapper {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            z-index: 10;
        }

        .container {
            background: white;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 100%;
        }

        h1 { color: #ff4b5c; margin-top: 0; font-size: 1.8rem; }
        p { line-height: 1.6; color: #555; font-size: 1.05rem; }

        button {
            padding: 14px 24px;
            border: none;
            border-radius: 12px;
            background: #ff4b5c;
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            margin: 5px;
        }

        /* 3. Photos - They appear above/below on mobile, side-by-side on PC */
        .side-photo {
            width: 100%;
            max-width: 320px;
            border-radius: 15px;
            border: 6px solid white;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            display: none; /* Hidden until Note opens */
            opacity: 0;
            transition: opacity 1s;
        }

        /* DESKTOP VIEW: Photos float to the sides */
        @media (min-width: 1100px) {
            .side-photo {
                position: fixed;
                top: 50%;
                width: 280px;
                display: block; /* Always exists on desktop */
                transform: translateY(-50%);
            }
            #photoLeft { left: 30px; transform: translateY(-50%) rotate(-3deg); }
            #photoRight { right: 30px; transform: translateY(-50%) rotate(3deg); }
            
            .side-photo.show { opacity: 1; }
        }

        /* MOBILE VIEW: Photos stack in order */
        @media (max-width: 1099px) {
            .side-photo.show { 
                display: block; 
                opacity: 1;
                animation: fadeIn 1s;
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 4. Emoji Rain */
        .emoji {
            position: fixed;
            top: -50px;
            z-index: 1;
            pointer-events: none;
        }
        @keyframes fall {
            to { transform: translateY(110vh) rotate(360deg); }
        }

        #surpriseBtn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            font-size: 30px;
            background: #fff;
            border-radius: 50%;
            width: 60px; height: 60px;
            display: none;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        #surpriseBtn.show { display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <div id="overlay">
        <h1>🎁 A message for you</h1>
        <button onclick="startEverything()">Tap to Open 🎈</button>
    </div>

    <div class="wrapper">
        <img id="photoLeft" src="photo1.jpg" alt="Memory" class="side-photo">

        <div class="container">
            <div id="mainPage">
                <h1>🎂 Happy Birthday!</h1>
                <p>I made something special just for you. Click the button below!</p>
                <button onclick="openNote()">Read my Note 💌</button>
            </div>

            <div id="notePage" style="display:none;">
                <h1>💌 Special Note</h1>
                <p>
                    You are one of the best friends I could ever ask for.<br><br>
                    Thank you for all the memories and laughs. I hope this year brings you nothing but happiness and success!
                </p>
                <button onclick="goBack()">⬅ Back</button>
            </div>
        </div>

        <img id="photoRight" src="photo2.jpg" alt="Memory" class="side-photo">
    </div>

    <button id="surpriseBtn" onclick="alert('🎉 Stay Amazing! 🎉')">🎁</button>

    <audio id="birthdaySong" loop>
        <source src="song.mp3" type="audio/mpeg">
    </audio>

    <script>
        const song = document.getElementById("birthdaySong");

        function startEverything() {
            document.getElementById("overlay").style.display = "none";
            song.play();
        }

        function openNote() {
            document.getElementById("mainPage").style.display = "none";
            document.getElementById("notePage").style.display = "block";
            document.getElementById("photoLeft").classList.add("show");
            document.getElementById("photoRight").classList.add("show");
            document.getElementById("surpriseBtn").classList.add("show");
        }

        function goBack() {
            document.getElementById("notePage").style.display = "none";
            document.getElementById("mainPage").style.display = "block";
            document.getElementById("photoLeft").classList.remove("show");
            document.getElementById("photoRight").classList.remove("show");
            document.getElementById("surpriseBtn").classList.remove("show");
        }

        function createEmoji() {
            const emoji = document.createElement("div");
            emoji.className = "emoji";
            emoji.textContent = ["🎂", "🎉", "🎈", "🎁", "✨"][Math.floor(Math.random()*5)];
            emoji.style.left = Math.random() * 100 + "vw";
            emoji.style.fontSize = Math.random() * 20 + 20 + "px";
            emoji.style.animation = `fall ${Math.random()*3 + 2}s linear forwards`;
            document.body.appendChild(emoji);
            setTimeout(() => emoji.remove(), 5000);
        }
        setInterval(createEmoji, 400);
    </script>
</body>
</html>
